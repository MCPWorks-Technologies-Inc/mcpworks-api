swagger: "2.0"
info:
  title: Legacy API
  version: "1.0"
host: legacy.example.com
basePath: /v2
schemes:
  - https
paths:
  /things:
    get:
      summary: List things (no operationId on purpose)
      parameters:
        - name: q
          in: query
          required: false
          type: string
      responses:
        "200":
          description: ok
          schema:
            type: object
    post:
      summary: Create a thing (no operationId on purpose)
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              label:
                type: string
            required:
              - label
      responses:
        "201":
          description: created
